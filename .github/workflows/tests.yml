name: tests

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run add-on tests
        run: bash packaging/test.sh
