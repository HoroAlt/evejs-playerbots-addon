services:
  server:
    restart: "no"
    stop_grace_period: 120s
    healthcheck:
      timeout: 20s
    environment:
      EVEJS_PLAYER_BOTS_TARGET: ${EVEJS_PLAYER_BOTS_TARGET:-500}
      EVEJS_PLAYER_BOTS_ROSTER_CEILING: ${EVEJS_PLAYER_BOTS_ROSTER_CEILING:-1500}
      EVEJS_PLAYER_BOTS_ROSTER_SEED_ENABLED: ${EVEJS_PLAYER_BOTS_ROSTER_SEED_ENABLED:-1}
      EVEJS_PLAYER_BOTS_ROSTER_SEED_BATCH_SIZE: ${EVEJS_PLAYER_BOTS_ROSTER_SEED_BATCH_SIZE:-5}
      EVEJS_PLAYER_BOTS_ROSTER_SEED_INTERVAL_MS: ${EVEJS_PLAYER_BOTS_ROSTER_SEED_INTERVAL_MS:-15000}
      EVEJS_PLAYER_BOTS_ROSTER_SEED_MAX_EVENT_LOOP_P95_MS: ${EVEJS_PLAYER_BOTS_ROSTER_SEED_MAX_EVENT_LOOP_P95_MS:-100}
      EVEJS_PLAYER_BOTS_ROSTER_SEED_MAX_PROCESS_CPU_PERCENT: ${EVEJS_PLAYER_BOTS_ROSTER_SEED_MAX_PROCESS_CPU_PERCENT:-85}
      EVEJS_PLAYER_BOTS_ROSTER_SEED_MAX_SINGLE_BOT_MS: ${EVEJS_PLAYER_BOTS_ROSTER_SEED_MAX_SINGLE_BOT_MS:-1000}
      EVEJS_PLAYER_BOTS_STARTUP_SEED_BATCH_SIZE: ${EVEJS_PLAYER_BOTS_STARTUP_SEED_BATCH_SIZE:-0}
      EVEJS_PLAYER_BOTS_MAX_ONLINE: ${EVEJS_PLAYER_BOTS_MAX_ONLINE:-1500}
      EVEJS_PLAYER_BOTS_CONNECTION_WINDOW_MS: ${EVEJS_PLAYER_BOTS_CONNECTION_WINDOW_MS:-28800000}
      EVEJS_PLAYER_BOTS_MAX_PER_SYSTEM: ${EVEJS_PLAYER_BOTS_MAX_PER_SYSTEM:-50}
      EVEJS_PLAYER_BOTS_MAX_CONCURRENT_WORK: ${EVEJS_PLAYER_BOTS_MAX_CONCURRENT_WORK:-5000}
      EVEJS_PLAYER_BOTS_MAX_CONCURRENT_CAPACITY_RELOCATIONS: ${EVEJS_PLAYER_BOTS_MAX_CONCURRENT_CAPACITY_RELOCATIONS:-100}
      EVEJS_PLAYER_BOTS_MAX_CONCURRENT_COLONY_SETUPS: ${EVEJS_PLAYER_BOTS_MAX_CONCURRENT_COLONY_SETUPS:-10}
      EVEJS_PLAYER_BOTS_ADDON_INTERVAL_MS: ${EVEJS_PLAYER_BOTS_ADDON_INTERVAL_MS:-300000}
      EVEJS_PLAYER_BOTS_ADDON_CONCURRENCY: ${EVEJS_PLAYER_BOTS_ADDON_CONCURRENCY:-16}
      EVEJS_PLAYER_BOTS_ADDON_BOT_DELAY_MS: ${EVEJS_PLAYER_BOTS_ADDON_BOT_DELAY_MS:-0}
      EVEJS_PLAYER_BOTS_ADDON_REQUEST_TIMEOUT_MS: ${EVEJS_PLAYER_BOTS_ADDON_REQUEST_TIMEOUT_MS:-120000}
      EVEJS_PLAYER_BOTS_WAR_TEST_CORPORATION_ID: ${EVEJS_PLAYER_BOTS_WAR_TEST_CORPORATION_ID:-}
      EVEJS_PLAYER_BOTS_ADDON_MODE: ${EVEJS_PLAYER_BOTS_ADDON_MODE:-auto}
      EVEJS_PLAYER_BOTS_ADDON_TOKEN: ${EVEJS_PLAYER_BOTS_ADDON_TOKEN:-}
      EVEJS_PLAYER_BOTS_ADDON_API_HOST: 0.0.0.0
      EVEJS_PLAYER_BOTS_ADDON_API_PORT: "26004"
      EVEJS_IMAGE_SERVER_BIND_HOST: ${EVEJS_IMAGE_SERVER_BIND_HOST:-0.0.0.0}
      EVEJS_PLAYER_BOTS_DASHBOARD_HOST: 0.0.0.0
      EVEJS_PLAYER_BOTS_DASHBOARD_CONTAINER_PORT: "8080"
      EVEJS_PLAYER_BOTS_DIRECTOR_THINK_MIN_MS: ${EVEJS_PLAYER_BOTS_DIRECTOR_THINK_MIN_MS:-90000}
      EVEJS_PLAYER_BOTS_DIRECTOR_THINK_MAX_MS: ${EVEJS_PLAYER_BOTS_DIRECTOR_THINK_MAX_MS:-210000}
      EVEJS_PLAYER_BOTS_DIRECTOR_INITIAL_SPREAD_MS: ${EVEJS_PLAYER_BOTS_DIRECTOR_INITIAL_SPREAD_MS:-90000}
      EVEJS_PLAYER_BOTS_DIRECTOR_SLICE_BUDGET_MS: ${EVEJS_PLAYER_BOTS_DIRECTOR_SLICE_BUDGET_MS:-8}
      EVEJS_PLAYER_BOTS_PATROL_ROTATION: ${EVEJS_PLAYER_BOTS_PATROL_ROTATION:-1}
      EVEJS_PLAYER_BOTS_UNOBSERVED_SITE_TICK_MS: ${EVEJS_PLAYER_BOTS_UNOBSERVED_SITE_TICK_MS:-10000}
      EVEJS_SPACE_TICK_SCHEDULER: ${EVEJS_SPACE_TICK_SCHEDULER:-deadline}
      EVEJS_PLAYER_BOTS_TICK_STALL_MS: ${EVEJS_PLAYER_BOTS_TICK_STALL_MS:-1000}
      EVEJS_PLAYER_BOTS_TICK_STALL_WATCH: ${EVEJS_PLAYER_BOTS_TICK_STALL_WATCH:-1}
      EVEJS_PLAYER_BOTS_TELEMETRY_FILE: ${EVEJS_PLAYER_BOTS_TELEMETRY_FILE:-0}
      EVEJS_PLAYER_BOTS_TELEMETRY_QUEUE_SCAN: ${EVEJS_PLAYER_BOTS_TELEMETRY_QUEUE_SCAN:-0}
      EVEJS_SCHEDULER_MAX_CONCURRENT_DISPATCH: ${EVEJS_SCHEDULER_MAX_CONCURRENT_DISPATCH:-24}

  playerbots-addon:
    image: evejs-local
    pull_policy: never
    entrypoint: ["node", "/app/addons/playerbots/index.js"]
    command: []
    depends_on:
      server:
        condition: service_healthy
    environment:
      EVEJS_PLAYER_BOTS_ADDON_URL: http://server:26004
      EVEJS_PLAYER_BOTS_IMAGE_SERVER_URL: ${EVEJS_PLAYER_BOTS_IMAGE_SERVER_URL:-http://server:26001/}
      EVEJS_PLAYER_BOTS_ADDON_TOKEN: ${EVEJS_PLAYER_BOTS_ADDON_TOKEN:-}
      EVEJS_PLAYER_BOTS_ADDON_INTERVAL_MS: ${EVEJS_PLAYER_BOTS_ADDON_INTERVAL_MS:-300000}
      EVEJS_PLAYER_BOTS_ADDON_CONCURRENCY: ${EVEJS_PLAYER_BOTS_ADDON_CONCURRENCY:-16}
      EVEJS_PLAYER_BOTS_ADDON_BOT_DELAY_MS: ${EVEJS_PLAYER_BOTS_ADDON_BOT_DELAY_MS:-0}
      EVEJS_PLAYER_BOTS_ADDON_REQUEST_TIMEOUT_MS: ${EVEJS_PLAYER_BOTS_ADDON_REQUEST_TIMEOUT_MS:-120000}
      NODE_OPTIONS: --max-old-space-size=384
    networks:
      - default
    ports:
      - "${EVEJS_PLAYER_BOTS_DASHBOARD_BIND:-0.0.0.0}:${EVEJS_PLAYER_BOTS_DASHBOARD_PORT:-8080}:8080"
    restart: "no"
    stop_grace_period: 20s
    mem_limit: 512m
